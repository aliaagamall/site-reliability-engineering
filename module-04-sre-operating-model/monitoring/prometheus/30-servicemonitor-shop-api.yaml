apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shop-api
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["shop"]
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      relabelings:
        - action: labeldrop
          regex: endpoint
