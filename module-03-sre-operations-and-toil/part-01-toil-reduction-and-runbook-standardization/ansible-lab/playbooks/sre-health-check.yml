---
- name: SRE health checks and cron recovery
  hosts: local
  gather_facts: true
  vars:
    report_path: /tmp/sre_health_report.txt

  tasks:
    - name: Check system uptime
      ansible.builtin.command: uptime
      register: uptime_result
      changed_when: false

    - name: Check root disk usage
      ansible.builtin.command: df -h /
      register: disk_result
      changed_when: false

    - name: Check memory usage
      ansible.builtin.command: free -m
      register: memory_result
      changed_when: false

    - name: Ensure cron is installed
      ansible.builtin.apt:
        name: cron
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Check cron status before restart
      ansible.builtin.command: service cron status
      register: cron_before
      changed_when: false
      failed_when: false

    - name: Restart cron service
      ansible.builtin.service:
        name: cron
        state: restarted
        use: service   # no systemd inside the container

    - name: Create SRE health report
      ansible.builtin.copy:
        dest: "{{ report_path }}"
        mode: "0644"
        content: |
          SRE HEALTH REPORT
          Generated: {{ ansible_date_time.iso8601 }}
          Host: {{ ansible_hostname }}

          [Uptime]
          {{ uptime_result.stdout }}

          [Disk usage /]
          {{ disk_result.stdout }}

          [Memory usage (MB)]
          {{ memory_result.stdout }}

          [Cron status before restart]
          {{ cron_before.stdout | default('n/a') }}

          [Action taken]
          Restarted cron service