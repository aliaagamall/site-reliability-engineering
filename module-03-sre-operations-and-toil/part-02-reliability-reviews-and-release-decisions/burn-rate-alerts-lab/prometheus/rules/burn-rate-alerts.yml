groups:
  - name: burn-rate-alerts
    rules:
      # Fast burn: short window, high threshold -> sudden incidents
      - alert: ErrorBudgetFastBurn
        expr: |
          (
            sum(rate(http_requests_total{job="slo-demo-app",code=~"5.."}[1m]))
            /
            sum(rate(http_requests_total{job="slo-demo-app"}[1m]))
          ) / 0.01 > 5
        for: 1m
        labels:
          severity: page
          slo: backend-api-availability
        annotations:
          summary: "Fast error budget burn"
          description: "Burn rate is {{ $value | printf \"%.1f\" }}x the allowed budget (1m window, threshold 5x)."

      # Slow burn: longer window, lower threshold -> gradual degradation
      - alert: ErrorBudgetSlowBurn
        expr: |
          (
            sum(rate(http_requests_total{job="slo-demo-app",code=~"5.."}[3m]))
            /
            sum(rate(http_requests_total{job="slo-demo-app"}[3m]))
          ) / 0.01 > 2
        for: 2m
        labels:
          severity: ticket
          slo: backend-api-availability
        annotations:
          summary: "Slow error budget burn"
          description: "Burn rate is {{ $value | printf \"%.1f\" }}x the allowed budget (3m window, threshold 2x)."