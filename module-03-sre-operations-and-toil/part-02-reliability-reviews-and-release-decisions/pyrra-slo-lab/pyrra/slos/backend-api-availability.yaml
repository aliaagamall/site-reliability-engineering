apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: backend-api-availability
  labels:
    pyrra.dev/team: sre
    pyrra.dev/service: backend-api
spec:
  target: "99"
  window: 1h
  description: Backend API availability, 99% of requests must not return 5xx.
  indicator:
    ratio:
      errors:
        metric: http_requests_total{job="slo-demo-app",code=~"5.."}
      total:
        metric: http_requests_total{job="slo-demo-app"}