apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollback-demo
  labels:
    app: rollback-demo
spec:
  replicas: 2
  progressDeadlineSeconds: 60   # Argo CD shows Degraded after 60s 
  selector:
    matchLabels:
      app: rollback-demo
  template:
    metadata:
      labels:
        app: rollback-demo
    spec:
      containers:
        - name: nginx
          image: nginx:does-not-exist-99
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5