services:
  slo-demo-app:
    build: ./app
    container_name: anomaly-app
    ports:
      - "8000:8000"

  traffic:
    build: ./app
    container_name: anomaly-traffic
    profiles: ["tools"]
    environment:
      TARGET: http://slo-demo-app:8000/orders
    depends_on:
      - slo-demo-app

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: anomaly-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - slo-demo-app

  grafana:
    image: grafana/grafana:11.3.0
    container_name: anomaly-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/metric-anomaly-dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data: